name: Build AvelisHubBL DLL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unpack source if using archive layout
        run: |
          if [ ! -f "AvelisHubBL/AvelisHubBL.csproj" ] && [ -f "AvelisHubBL-source.zip" ]; then
            unzip -o -q AvelisHubBL-source.zip -d .
          fi

      - name: Restore GameReferences from secret (if configured)
        env:
          GAME_REFERENCES_ZIP_B64: ${{ secrets.GAME_REFERENCES_ZIP_B64 }}
        run: |
          if [ -n "$GAME_REFERENCES_ZIP_B64" ]; then
            echo "$GAME_REFERENCES_ZIP_B64" | tr -d '\r\n' | base64 -d > GameReferences.zip
            unzip -o -q GameReferences.zip -d /tmp/gamerefs
            rm -f GameReferences.zip
            mkdir -p GameReferences/MelonLoader/net8 GameReferences/MelonLoader/Il2CppAssemblies GameReferences/Unity GameReferences/Mods
            for dll in MelonLoader.dll 0Harmony.dll Il2CppInterop.Runtime.dll; do
              found=$(find /tmp/gamerefs -name "$dll" -type f | head -n1)
              [ -n "$found" ] && cp "$found" GameReferences/MelonLoader/net8/
            done
            found=$(find /tmp/gamerefs -name "Il2Cppmscorlib.dll" -type f | head -n1)
            [ -n "$found" ] && cp "$found" GameReferences/MelonLoader/Il2CppAssemblies/
            for dll in UnityEngine.CoreModule.dll UnityEngine.PhysicsModule.dll UnityEngine.TextRenderingModule.dll; do
              found=$(find /tmp/gamerefs -name "$dll" -type f | head -n1)
              [ -n "$found" ] && cp "$found" GameReferences/Unity/
            done
            found=$(find /tmp/gamerefs -name "BoneLib.dll" -type f | head -n1)
            [ -n "$found" ] && cp "$found" GameReferences/Mods/
            rm -rf /tmp/gamerefs
          fi

      - name: Fetch LemonLoader 0.6.5.1 and BoneLib 3.2.2 if missing
        run: |
          mkdir -p GameReferences/MelonLoader/net8 GameReferences/Mods
          if [ ! -f "GameReferences/MelonLoader/net8/MelonLoader.dll" ]; then
            curl -fsSL -L "https://github.com/LemonLoader/MelonLoader/releases/download/0.6.5.1/melon_data.zip" -o /tmp/melon_data.zip
            unzip -o -q /tmp/melon_data.zip -d /tmp/melon_data
            find /tmp/melon_data -type f \( -name "MelonLoader.dll" -o -name "0Harmony.dll" -o -name "Il2CppInterop.Runtime.dll" \) -exec cp {} GameReferences/MelonLoader/net8/ \;
            rm -rf /tmp/melon_data /tmp/melon_data.zip
          fi
          if [ ! -f "GameReferences/Mods/BoneLib.dll" ]; then
            curl -fsSL -L "https://thunderstore.io/package/download/bonelib/BoneLib/3.2.2/" -o /tmp/bonelib.zip
            unzip -o -q /tmp/bonelib.zip -d /tmp/bonelib
            cp /tmp/bonelib/Mods/BoneLib.dll GameReferences/Mods/BoneLib.dll
            rm -rf /tmp/bonelib /tmp/bonelib.zip
          fi

      - name: Verify required GameReferences
        run: |
          required=(
            "GameReferences/MelonLoader/net8/MelonLoader.dll"
            "GameReferences/MelonLoader/net8/0Harmony.dll"
            "GameReferences/MelonLoader/net8/Il2CppInterop.Runtime.dll"
            "GameReferences/MelonLoader/Il2CppAssemblies/Il2Cppmscorlib.dll"
            "GameReferences/Unity/UnityEngine.CoreModule.dll"
            "GameReferences/Unity/UnityEngine.PhysicsModule.dll"
            "GameReferences/Unity/UnityEngine.TextRenderingModule.dll"
            "GameReferences/Mods/BoneLib.dll"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Copy the 4 Quest BONELAB Il2CppAssemblies/Unity DLLs into GameReferences/ or base64-encode a zip of them into the GAME_REFERENCES_ZIP_B64 secret."
            exit 1
          fi

      - name: Publish AvelisHubBL.dll
        run: |
          dotnet publish AvelisHubBL/AvelisHubBL.csproj \
            --configuration Release \
            -p:GameReferencesDir="$GITHUB_WORKSPACE/GameReferences" \
            -p:RestoreIgnoreFailedSources=true \
            --output dist/build
          cp dist/build/AvelisHubBL.dll AvelisHubBL.dll
          sha256sum AvelisHubBL.dll > SHA256SUMS.txt

      - name: Upload built DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvelisHubBL-dll
          path: |
            AvelisHubBL.dll
            SHA256SUMS.txt
